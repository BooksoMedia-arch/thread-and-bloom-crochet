  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    :root{--rose:#b84c68;--rose2:#d96f87;--cream:#fff9f5;--ink:#352a2e;--muted:#786b70;--card:#fff;--line:#f0dfe2;--leaf:#294a3e;--gold:#e7b547;--sage:#edf6eb}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--ink)}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}.container{max-width:1180px;margin:0 auto;padding:0 22px}
    header{position:sticky;top:0;z-index:20;background:rgba(255,249,245,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.brand{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:25px;font-weight:700;color:var(--leaf)}.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#f1d675,#e7b547);display:grid;place-items:center;color:var(--leaf)}.nav-actions{display:flex;align-items:center;gap:12px}.cartbtn{border:1px solid var(--leaf);background:var(--leaf);color:#fff;padding:10px 14px;border-radius:6px;font-weight:700;cursor:pointer}.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:50%;background:var(--gold);color:var(--leaf);font-size:11px;font-weight:800;margin-left:5px}
    .back-link{display:inline-flex;margin:26px 0 10px;padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--leaf);font-weight:700}
    .product-shell{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;padding:18px 0 60px}.gallery{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 32px rgba(52,42,46,.04)}.main-image{width:100%;height:520px;object-fit:cover;border-radius:18px;background:#f7f1ef}.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}.thumb{height:80px;object-fit:cover;border-radius:12px;border:2px solid transparent;background:#f7ede8;cursor:pointer}.thumb.active{border-color:var(--rose)}
    .info-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px 24px 20px;box-shadow:0 16px 32px rgba(52,42,46,.04)}.eyebrow{display:inline-block;padding:7px 12px;border-radius:999px;background:#fbe7eb;color:var(--rose);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px}.h1{font-family:'Playfair Display',serif;font-size:clamp(34px,4vw,52px);margin:14px 0 10px;color:var(--leaf)}.price{font-size:38px;font-weight:800;color:var(--leaf);margin:6px 0 18px}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.meta span{padding:7px 10px;border-radius:999px;background:var(--sage);color:var(--leaf);font-weight:700;font-size:12px}.meta .stock-status{background:#e5f3e8;color:#236b38}.meta .stock-status.out-of-stock{background:#fbe7eb;color:#a33d4f}.meta .stock-status.unknown{background:#fff1d6;color:#805916}.description{margin:0 0 22px;color:var(--muted);line-height:1.8;font-size:16px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}.primary-btn,.secondary-btn{border:none;border-radius:14px;font-weight:800;padding:14px 18px;cursor:pointer}.primary-btn{background:var(--leaf);color:#fff}.secondary-btn{background:var(--rose);color:#fff}.primary-btn:disabled,.secondary-btn:disabled{opacity:.55;cursor:not-allowed}.detail-list{list-style:none;padding:0;margin:18px 0 0;border-top:1px solid var(--line)}.detail-list li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted)}.detail-list b{color:var(--ink)}
    .detail-list .color-value{color:var(--muted)}.detail-list .color-word{color:var(--swatch-color);font-weight:700}.detail-list .product-color-gradient{font-weight:700;background:var(--product-color-gradient);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}.detail-list .availability-value{color:#237343;font-weight:700}
    @media(max-width:900px){.product-shell{grid-template-columns:1fr}.main-image{height:420px}.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:560px){.nav{padding:12px 0}.brand{font-size:20px}.product-shell{padding-bottom:32px}.main-image{height:320px}.actions{flex-direction:column}.primary-btn,.secondary-btn{width:100%}}
  </style>

      { id: 55, name: 'Phone Pouch', price: 249, category: 'Pouches', image: 'Phone Pouch Rs-249.jpg', color: 'Royal pink' }
    ];

    function loadCart(){
      try { const saved = JSON.parse(localStorage.getItem('threadBloomCart') || '{}'); return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {}; }
      catch { return {}; }
    }

    function saveCart(cart){
      localStorage.setItem('threadBloomCart', JSON.stringify(cart));
      localStorage.setItem('threadBloomProductCatalog', JSON.stringify(products));
    }

    function updateCartCount(){
      const cart = loadCart();
      const total = Object.values(cart).reduce((sum, qty) => sum + Number(qty || 0), 0);
      document.getElementById('cartCount').textContent = total;
    }

    const productColorPalette = {
        pink: '#b83264',
        red: '#b42332',
        blue: '#286090',
        green: '#2f6b3f',
        purple: '#6e3c91',
        violet: '#6e3c91',
        orange: '#a74b0c',
        yellow: '#927000',
        black: '#252525',
        gray: '#646b73',
        brown: '#76502f',
        maroon: '#7b2336',
        peach: '#b45b3e',
        aqua: '#14777a',
        white: '#777064',
        cream: '#947c59',
        ivory: '#947c59',
        pastel: '#8663a8',
        cherry: '#b42332'
      };

    function escapeHtml(value){
      return String(value || '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function getProductColorValues(color){
      const matches = String(color || '').match(/[A-Za-z]+(?:-[A-Za-z]+)*/g) || [];
      return [...new Set(matches
        .map(word => productColorPalette[word.toLowerCase()])
        .filter(Boolean))];
    }

    function renderProductColor(color){
      const safeColor = String(color || 'Handpicked palette').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
      return safeColor.replace(/[A-Za-z]+(?:-[A-Za-z]+)*/g, word => {
        const colorValue = productColorPalette[word.toLowerCase()];
        return colorValue
          ? `<span class="color-word" style="--swatch-color:${colorValue}">${word}</span>`
          : word;
      });
    }

    function renderProductMetadata(value, productColor){
      const safeValue = escapeHtml(value);
      const colors = getProductColorValues(productColor);
      if (colors.length > 1){
        const stops = colors.map((color, index) => {
          const position = Math.round(index / (colors.length - 1) * 100);
          return `${color} ${position}%`;
        }).join(', ');
        return `<span class="product-color-gradient" style="--product-color-gradient:linear-gradient(90deg, ${stops})">${safeValue}</span>`;
      }
      if (colors.length === 1){
        return `<span class="product-color-value" style="color:${colors[0]}">${safeValue}</span>`;
      }
      return `<span class="product-color-value">${safeValue}</span>`;
    }

    function addToCart(id){
      const product = products.find(item => item.id === id);
      if (!product) return;
      const cart = loadCart();
      const productId = String(id);
      cart[productId] = (Number(cart[productId]) || 0) + 1;
      saveCart(cart);
      updateCartCount();
      window.location.href = 'index.html';
    }

    function renderProduct(){
      const params = new URLSearchParams(window.location.search);
      const id = Number(params.get('id'));
      const product = products.find(item => item.id === id) || products[0];
      const imagePath = `images/${product.image}`;
      const detailMarkup = `
        <div class="gallery">
          <img class="main-image" src="${imagePath}" alt="${product.name}" onerror="this.onerror=null;this.src='images/phone-pouch-pink.jpeg'">
          <div class="thumbs">
            <img class="thumb active" src="${imagePath}" alt="${product.name}" onerror="this.onerror=null;this.src='images/phone-pouch-pink.jpeg'">
            <img class="thumb" src="${imagePath}" alt="${product.name}" onerror="this.onerror=null;this.src='images/phone-pouch-pink.jpeg'">
            <img class="thumb" src="${imagePath}" alt="${product.name}" onerror="this.onerror=null;this.src='images/phone-pouch-pink.jpeg'">
            <img class="thumb" src="${imagePath}" alt="${product.name}" onerror="this.onerror=null;this.src='images/phone-pouch-pink.jpeg'">
          </div>
        </div>
        <div class="info-card">
          <div class="eyebrow">${product.category}</div>
          <h1 class="h1">${product.name}</h1>
          <div class="price">₹${product.price}</div>
          <div class="meta">
            <span>Handmade</span>
            <span>Gift-ready</span>
            <span>COD available</span>
          </div>
          <p class="description">A handcrafted crochet piece made with soft yarn, bright colours, and a thoughtful boutique finish. Perfect for gifting, styling, or adding a little extra personality to your everyday essentials.</p>
          <div class="actions">
            <button class="primary-btn" onclick="addToCart(${product.id})">Add to cart</button>
            <button class="secondary-btn" onclick="window.location.href='https://wa.me/918371915111?text=${encodeURIComponent('Hello Ritu\'s Thread & HandBloom! I want to order ' + product.name + ' for ₹' + product.price + '.')}'">Order on WhatsApp</button>
          </div>
          <ul class="detail-list">
            <li><b>Color</b><span class="color-value">${renderProductColor(product.color)}</span></li>
            <li><b>Availability</b><span class="availability-value">Available</span></li>
            <li><b>Category</b>${renderProductMetadata(product.category, product.color)}</li>
            <li><b>Delivery</b>${renderProductMetadata('Local COD available', product.color)}</li>
            <li><b>Care</b>${renderProductMetadata('Soft hand wash', product.color)}</li>
          </ul>
        </div>
      `;
      document.getElementById('productDetail').innerHTML = detailMarkup;
      document.querySelectorAll('.thumb').forEach((thumb) => {
        thumb.addEventListener('click', () => {
          document.querySelector('.main-image').src = thumb.src;
          document.querySelectorAll('.thumb').forEach(item => item.classList.remove('active'));
          thumb.classList.add('active');
        });
      });
    }

    function openCart(){
      if (window.opener && !window.opener.closed) {
        window.opener.openCart && window.opener.openCart();
      }
      window.location.href = 'index.html';
    }

    renderProduct();
    updateCartCount();
  </script>
