<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    :root{--rose:#b84c68;--rose2:#d96f87;--cream:#fff9f5;--ink:#352a2e;--muted:#786b70;--card:#fff;--line:#f0dfe2;--leaf:#294a3e;--gold:#e7b547;--sage:#edf6eb}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--ink)} a{text-decoration:none;color:inherit}.container{max-width:980px;margin:0 auto;padding:0 22px}.header{position:sticky;top:0;background:rgba(255,249,245,.98);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.brand{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--leaf)}.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#f1d675,#e7b547);display:grid;place-items:center}.wrap{padding:52px 0 80px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;text-align:center;box-shadow:0 18px 38px rgba(52,42,46,.04)}.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#eaf6ec;color:var(--leaf);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px}.h1{font-family:'Playfair Display',serif;font-size:clamp(34px,5vw,52px);margin:18px 0 12px;color:var(--leaf)}.text{color:var(--muted);font-size:17px;line-height:1.8;max-width:720px;margin:0 auto 18px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.button{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:12px;font-weight:800;cursor:pointer}.primary{background:var(--leaf);color:#fff}.secondary{background:var(--rose);color:#fff}.small-note{margin-top:16px;color:var(--muted);font-size:13px}  </style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="logo">✿</span> Ritu's Thread & HandBloom</a>
      <a href="index.html" style="padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--leaf);font-weight:700;">Shop more</a>
    </div>
  </header>
  <main class="container wrap">
    <div class="card">
      <div class="badge">Order placed</div>

      <div class="actions">
        <a class="button primary" href="index.html">Continue shopping</a>
        <a class="button secondary" href="https://wa.me/918371915111" target="_blank" rel="noopener">Chat on WhatsApp</a>
      </div>
      <div class="small-note">COD available within 2km from LIC More.</div>
    </div>
  </main>
</body>
</html>
